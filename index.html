            <path
              d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 21.8-88.5 21.8-11.4 0-51.1-20.8-82.3-20.2-41.2.6-78.9 23.9-100.1 60.6-43.5 75.5-11.1 187.3 30.9 248 20.6 29.7 45.3 63.3 77.3 62.1 31.1-1.2 42.9-20.1 80.7-20.1 37.8 0 48.6 20.1 81.3 19.5 33.3-.6 54.4-30.3 74.8-60.2 23.5-34.4 33.1-67.7 33.5-69.3-.8-.3-64.1-24.6-64.3-97.7zm-63.2-167.4c16.2-19.5 27.3-46.7 24.3-73.9-23.3 1-51.5 15.5-68.2 34.9-14.9 17.1-28 44.8-24.4 71.3 26.1 2 52.1-12.8 68.3-32.3z"

        <a

      <div

        قريباً تحديثات جديدة وحصرية

      <footer

      >
        <!-- <p>© 2025 كامكس إيت. جميع الحقوق محفوظة.</p> -->
        <div class="flex justify-center gap-4">
          <a href="">

              class="w-7 h-7"
              src="assets/svgs/instagram-logo.svg"
              alt="instagram-logo"
            />

          <a href="">

          <a

            href="https://www.facebook.com/profile.php?id=61579349012980"

              class="w-7 h-7"
              src="assets/svgs/facebook.svg"
              alt="facebook"
            />
          </a>
        </div>
      </footer>

      <div class="relative flex items-center justify-center mt-4">
        <!-- Progress Ring -->
        <svg class="w-32 h-32 transform -rotate-90">
          <circle
            cx="64"
            cy="64"
            r="58"
            stroke="currentColor"
            stroke-width="8"
            fill="transparent"
            class="text-gray-300"
          />
          <circle
            id="progress-ring"
            cx="64"
            cy="64"
            r="58"
            stroke="currentColor"
            stroke-width="8"
            fill="transparent"
            stroke-dasharray="364.4"
            stroke-dashoffset="0"
            class="text-blue-600 transition-all duration-1000 ease-linear"
          />
        </svg>

        <!-- Timer Display -->
        <span id="timer-text" class="absolute text-4xl font-bold text-gray-800"
          >4</span
        >
      </div>

      <!-- <div id="content"></div> -->
    </main>
  </body>

  <script>
    const userAgent = navigator.userAgent || navigator.vendor || window.opera;

    const appStoreLink = "https://apps.apple.com/us/app/camexeat/id6741780650";
    const playStoreLink =
      "https://play.google.com/store/apps/details?id=ly.camex.eat.customer&hl=en&pli=1";

    let timeLeft = 4;
    const timerText = document.getElementById("timer-text");
    const progressRing = document.getElementById("progress-ring");
    const circumference = 2 * Math.PI * 58;

    const interval = setInterval(() => {
      timeLeft--;
      timerText.textContent = timeLeft;

      // Update progress ring offset
      const offset = circumference - (timeLeft / 4) * circumference;
      progressRing.style.strokeDashoffset = offset;

      if (timeLeft <= 0) {
        clearInterval(interval);
        timerText.textContent = "0";

        if (/android/i.test(userAgent)) {
          window.location.href = playStoreLink;
        } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
          window.location.href = playStoreLink;
        } else {
          window.location.href = playStoreLink;
        }
      }
    }, 1000);
  </script>
</html>
